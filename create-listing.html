<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List your property | RentNest</title><meta name="description" content="Create a rental listing and reach renters across the US."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;800&display=swap"><link rel="stylesheet" href="style.css"></head><body data-page="create"><div id="nav"></div>
<section><div class="wrap"><h1>List your property</h1><p class="note">Fill in the details renters look for first.</p>
<form class="form" id="create"><label for="title">Listing title</label><input id="title" name="title" required maxlength="90" placeholder="Sunny 2 bedroom near downtown">
<div class="two"><div><label for="city">City</label><input id="city" name="city" required></div><div><label for="state">State</label><input id="state" name="state" required maxlength="2" placeholder="TX"></div></div>
<div class="two"><div><label for="zip">ZIP code</label><input id="zip" name="zip" pattern="[0-9]{5}" required></div><div><label for="rent">Monthly rent (USD)</label><input id="rent" name="rent" type="number" min="1" required></div></div>
<div class="two"><div><label for="beds">Bedrooms</label><select id="beds" name="beds"><option value="0">Studio</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div><div><label for="baths">Bathrooms</label><input id="baths" name="baths" type="number" min="1" step="0.5" value="1" required></div></div>
<div class="two"><div><label for="type">Property type</label><select id="type" name="type"><option>Apartment</option><option>House</option><option>Townhome</option><option>Studio</option><option>Condo</option></select></div><div><label for="furnished">Furnished</label><select id="furnished" name="furnished"><option value="no">No</option><option value="yes">Yes</option></select></div></div>
<label for="available">Available from</label><input id="available" name="available" type="date" required>
<label for="desc">Description</label><textarea id="desc" name="desc" rows="5" required minlength="60" placeholder="Describe the layout, the neighborhood and what is included."></textarea>
<label for="amen">Amenities (comma separated)</label><input id="amen" name="amen" placeholder="Laundry, Parking, Pets allowed">
<p><button>Publish listing</button></p></form></div></section>
<div id="footer"></div><script src="app.js"></script></body></html>

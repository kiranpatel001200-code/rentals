<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rentals in the United States | RentNest</title>
<meta name="description" content="Browse apartments, houses and studios for rent across the United States.">
<style>
:root{--ink:#17202a;--muted:#55606b;--bg:#f7f8f9;--line:#d9dee3;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--white);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:14px;padding-bottom:14px}
.logo{font:700 1.25rem Georgia,serif;text-decoration:none}
nav a{margin-left:18px;text-decoration:none;color:var(--muted)}
nav a.on{color:var(--ink);font-weight:600}
h1{font:700 1.8rem Georgia,serif;margin:28px 0 14px}
form{display:flex;flex-wrap:wrap;gap:10px;background:var(--white);border:1px solid var(--line);padding:12px;border-radius:6px}
select,input{flex:1 1 150px;padding:10px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--white)}
button{padding:10px 20px;font:600 1rem system-ui,sans-serif;color:var(--white);background:var(--ink);border:0;border-radius:4px;cursor:pointer}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #e0a100;outline-offset:2px}
#count{color:var(--muted);margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:48px}
.card{background:var(--white);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card .ph{width:100%;aspect-ratio:3/2;object-fit:cover;background:#e3e7ea;display:block}
.card .body{padding:14px 16px 16px}
.card h2{font:700 1.05rem Georgia,serif;margin:0 0 4px}
.price{font-weight:700;font-size:1.1rem}
.meta{color:var(--muted);font-size:.95rem}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:6px;padding:26px;color:var(--muted);margin-bottom:48px}
</style>
</head>
<body>
<header><div class="wrap">
<a class="logo" href="index.html">RentNest</a>
<nav><a href="listings.html" class="on">Browse rentals</a><a href="create-listing.html">List your property</a><a href="account.html">My account</a></nav>
</div></header>

<main class="wrap">
<h1>Rentals in the United States</h1>
<form id="f">
<input id="city" placeholder="City" aria-label="City">
<select id="state" aria-label="State"><option value="">Any state</option></select>
<select id="beds" aria-label="Bedrooms"><option value="">Any bedrooms</option><option value="0">Studio</option><option value="1">1</option><option value="2">2</option><option value="3">3+</option></select>
<button type="submit">Search</button>
</form>
<p id="count" role="status" aria-live="polite"></p>
<div class="grid" id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb = supabase.createClient("https://abppfpgazlngdhrejrog.supabase.co", "sb_publishable_aDiJt8SXRag8hD73rhiFuQ_ezmlGWo5");
var $ = function(id){ return document.getElementById(id); };
function sid(){ try{ var s = localStorage.getItem("rn_sid"); if(!s){ s = crypto.randomUUID(); localStorage.setItem("rn_sid", s); } return s; }catch(e){ return null; } }
function track(type, extra){ try{ sb.from("site_events").insert(Object.assign({ event_type: type, path: location.pathname, session_id: sid() }, extra || {})).then(function(){}); }catch(e){} }

var qs = new URLSearchParams(location.search);
$("city").value = qs.get("city") || "";
$("beds").value = qs.get("bedrooms") || "";
var wantState = (qs.get("state") || "").toUpperCase();

function money(n){ return "$" + Number(n).toLocaleString("en-US") + "/mo"; }
function card(l){
  var a = document.createElement("div"); a.className = "card";
  var imgs = (l.listing_images || []).slice().sort(function(x, y){ return (y.is_primary - x.is_primary) || (x.display_order - y.display_order); });
  var img = document.createElement("img"); img.className = "ph"; img.loading = "lazy"; img.alt = l.title;
  if(imgs.length){ img.src = imgs[0].url; }
  a.appendChild(img);
  var b = document.createElement("div"); b.className = "body";
  var p = document.createElement("div"); p.className = "price"; p.textContent = money(l.monthly_rent);
  var h = document.createElement("h2"); h.textContent = l.title;
  var m = document.createElement("div"); m.className = "meta";
  m.textContent = (l.bedrooms === 0 ? "Studio" : l.bedrooms + " bed") + ", " + l.bathrooms + " bath \u00B7 " + l.city + ", " + String(l.state).trim();
  b.appendChild(p); b.appendChild(h); b.appendChild(m); a.appendChild(b);
  return a;
}

async function load(logIt){
  var city = $("city").value.trim().replace(/[%,()]/g, "");
  var st = $("state").value, beds = $("beds").value;
  var q = sb.from("listings")
    .select("id,title,monthly_rent,bedrooms,bathrooms,city,state,listing_images(url,is_primary,display_order)")
    .eq("status", "approved").order("created_at", { ascending: false }).limit(60);
  if(st) q = q.eq("state", st);
  if(city) q = q.ilike("city", "%" + city + "%");
  if(beds === "3") q = q.gte("bedrooms", 3); else if(beds !== "") q = q.eq("bedrooms", parseInt(beds, 10));
  var res = await q;
  var grid = $("grid"); grid.textContent = "";
  if(res.error){ $("count").textContent = "Could not load rentals. Please try again."; return; }
  var rows = res.data || [];
  if(logIt){ track("search", { city: city || null, state: st || null, bedrooms: beds === "" ? null : Math.min(parseInt(beds, 10), 10), results_count: rows.length }); }
  $("count").textContent = rows.length ? rows.length + " rental" + (rows.length > 1 ? "s" : "") + " found" : "";
  if(!rows.length){
    var e = document.createElement("p"); e.className = "empty";
    e.textContent = "No rentals match your search yet. Try another city, or check back soon.";
    grid.className = ""; grid.appendChild(e); return;
  }
  grid.className = "grid";
  rows.forEach(function(l){ grid.appendChild(card(l)); });
}

(async function(){
  var s = await sb.from("states").select("abbreviation,name").eq("country", "USA").order("name");
  (s.data || []).forEach(function(x){
    var o = document.createElement("option"); o.value = x.abbreviation.trim(); o.textContent = x.name; $("state").appendChild(o);
  });
  $("state").value = wantState;
  var fromLink = !!(qs.get("city") || qs.get("bedrooms") || qs.get("state"));
  track("page_view");
  load(fromLink);
})();
$("f").onsubmit = function(e){ e.preventDefault(); load(true); };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | RentNest</title>
<style>
:root{--ink:#17202a;--muted:#55606b;--bg:#f7f8f9;--line:#d9dee3;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit}
.logo{display:block;max-width:420px;margin:28px auto 0;padding:0 20px;font:700 1.25rem Georgia,serif;text-decoration:none}
.card{max-width:420px;margin:16px auto 40px;background:var(--white);border:1px solid var(--line);border-radius:6px;padding:26px}
h1{font:700 1.6rem Georgia,serif;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;margin:0;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select{width:100%;padding:11px;font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--white)}
button{width:100%;margin-top:18px;padding:12px;font:600 1rem system-ui,sans-serif;color:var(--white);background:var(--ink);border:0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button.link{background:none;color:var(--muted);text-decoration:underline;margin-top:8px;padding:6px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #e0a100;outline-offset:2px}
small{color:var(--muted)}
#msg{margin-top:14px;min-height:1.4em;font-size:.95rem}
#msg.err{color:#b3261e}
#msg.ok{color:#0f6b4f}
.hide{display:none}
.btn{display:block;text-align:center;margin-top:18px;padding:12px;font:600 1rem system-ui,sans-serif;color:var(--white);background:var(--ink);border-radius:4px;text-decoration:none}
ol{padding-left:1.2em;color:var(--muted)}
ol li{margin-bottom:6px}
.code{letter-spacing:.4em;font-size:1.4rem;text-align:center}
</style>
</head>
<body>
<a class="logo" href="index.html">RentNest</a>
<div class="card">
<div id="tabs" class="tabs">
<button type="button" id="tabLogin" class="on">Log in</button>
<button type="button" id="tabSignup">Sign up</button>
</div>

<form id="stLogin">
<h1>Welcome back</h1>
<label for="lEmail">Email</label>
<input id="lEmail" type="email" autocomplete="email" required>
<label for="lPass">Password</label>
<input id="lPass" type="password" autocomplete="current-password" required>
<button type="submit" id="lBtn">Log in</button>
<button type="button" class="link hide" id="resendLogin">Resend verification email</button>
<button type="button" class="link" id="toForgot">Forgot password?</button>
</form>

<form id="stSignup" class="hide">
<h1>Create your account</h1>
<label for="sName">Full name</label>
<input id="sName" autocomplete="name" required>
<label for="sEmail">Email</label>
<input id="sEmail" type="email" autocomplete="email" required>
<label for="sPhone">Phone <small>(optional)</small></label>
<input id="sPhone" type="tel" autocomplete="tel">
<label for="sRole">I want to</label>
<select id="sRole"><option value="renter">Rent a property</option><option value="landlord">List my property</option></select>
<label for="sPass">Create a password <small>(at least 8 characters)</small></label>
<input id="sPass" type="password" autocomplete="new-password" minlength="8" required>
<label for="sPass2">Confirm password</label>
<input id="sPass2" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit" id="sBtn">Sign up</button>
</form>

<div id="stCheck" class="hide">
<h1 id="cTitle"></h1>
<p class="sub" id="cText"></p>
<ol id="cSteps"></ol>
<a id="cGmail" class="btn hide" href="https://mail.google.com/" target="_blank" rel="noopener">Open Gmail</a>
<button type="button" id="cResend">Send the email again</button>
<button type="button" class="link" id="cBack">Back to log in</button>
</div>

<form id="stForgot" class="hide">
<h1>Reset your password</h1>
<p class="sub">Enter your email and we will send you a reset link or code.</p>
<label for="fEmail">Email</label>
<input id="fEmail" type="email" autocomplete="email" required>
<button type="submit" id="fBtn">Send reset email</button>
<button type="button" class="link" id="fBack">Back to log in</button>
</form>

<form id="stReset" class="hide">
<h1>Set a new password</h1>
<label for="rPass">New password <small>(at least 8 characters)</small></label>
<input id="rPass" type="password" autocomplete="new-password" minlength="8" required>
<label for="rPass2">Confirm new password</label>
<input id="rPass2" type="password" autocomplete="new-password" minlength="8" required>
<button type="submit" id="rBtn">Save password</button>
</form>

<div id="stIn" class="hide">
<h1>You are logged in</h1>
<p class="sub" id="who"></p>
<button type="button" id="goHome">Go to home page</button>
<button type="button" class="link" id="logout">Log out</button>
</div>

<div id="msg" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SITE = "https://kiranpatel001200-code.github.io/rentals/";
var sb = supabase.createClient(
  "https://abppfpgazlngdhrejrog.supabase.co",
  "sb_publishable_aDiJt8SXRag8hD73rhiFuQ_ezmlGWo5"
);
var $ = function(id){ return document.getElementById(id); };
var STEPS = ["stLogin","stSignup","stCheck","stForgot","stReset","stIn"];
var pendingEmail = "";
var recovering = false;

/*
  NEW:
  Remember the page from which the user opened login/signup.
  Example:
  login.html?returnTo=listings.html
  login.html?returnTo=listing.html?id=123
*/
function getReturnTo(){
  var p = new URLSearchParams(location.search).get("returnTo");
  if(p){
    try{
      p = decodeURIComponent(p);
    }catch(e){}
  }

  // Only allow redirects inside this GitHub Pages site.
  if(p && !/^https:\/\/kiranpatel001200-code\.github\.io\/rentals\//i.test(p)){
    if(/^\/rentals\//i.test(p)){
      p = SITE + p.replace(/^\/rentals\//i,"");
    }else if(!/^https?:\/\//i.test(p)){
      p = SITE + p.replace(/^\/+/,"");
    }else{
      p = SITE + "index.html";
    }
  }

  return p || localStorage.getItem("rn_return_to") || (SITE + "index.html");
}

var returnTo = getReturnTo();
localStorage.setItem("rn_return_to", returnTo);

function goBackToOrigin(){
  var target = returnTo || localStorage.getItem("rn_return_to") || (SITE + "index.html");

  // Never redirect outside the RentNest GitHub Pages site.
  if(!/^https:\/\/kiranpatel001200-code\.github\.io\/rentals\//i.test(target)){
    target = SITE + "index.html";
  }

  localStorage.removeItem("rn_return_to");
  location.replace(target);
}

function show(step){
  STEPS.forEach(function(s){ $(s).classList.toggle("hide", s !== step); });
  $("tabs").classList.toggle("hide", step !== "stLogin" && step !== "stSignup");
  $("tabLogin").classList.toggle("on", step === "stLogin");
  $("tabSignup").classList.toggle("on", step === "stSignup");
  say("");
}

function say(t, k){
  $("msg").textContent = t || "";
  $("msg").className = k || "";
}

function friendly(err){
  var m = (err && err.message) || "Something went wrong.";
  if(/invalid login/i.test(m)) return "Wrong email or password.";
  if(/rate limit|too many|seconds/i.test(m)) return "Too many attempts. Please wait a little and try again.";
  if(/at least|weak|password should/i.test(m)) return "Choose a stronger password (at least 8 characters).";
  return m;
}

function busy(btn, on){ $(btn).disabled = on; }

async function showSession(){
  var r = await sb.auth.getSession();

  if(r.data.session){
    // NEW:
    // After successful login/email confirmation, return to the page
    // where the user originally started login/signup.
    goBackToOrigin();
  }else{
    show("stLogin");
  }
}

$("tabLogin").onclick = function(){ show("stLogin"); };
$("tabSignup").onclick = function(){ show("stSignup"); };
$("toForgot").onclick = function(){ $("fEmail").value = $("lEmail").value; show("stForgot"); };
$("fBack").onclick = function(){ show("stLogin"); };

$("resendLogin").onclick = async function(){
  var email = $("lEmail").value.trim();

  if(!email){
    say("Enter your email address first.", "err");
    return;
  }

  busy("resendLogin", true);
  say("Sending verification email...");

  var res = await sb.auth.resend({
    type: "signup",
    email: email,
    options: {
      emailRedirectTo: SITE + "login.html?returnTo=" + encodeURIComponent(returnTo)
    }
  });

  busy("resendLogin", false);
  say(
    res.error ? friendly(res.error) : "Verification email sent again. Check your inbox.",
    res.error ? "err" : "ok"
  );
};

/* Log in */
$("stLogin").onsubmit = async function(e){
  e.preventDefault();

  var email = $("lEmail").value.trim();
  busy("lBtn", true);
  say("Logging in...");

  var res = await sb.auth.signInWithPassword({
    email: email,
    password: $("lPass").value
  });

  busy("lBtn", false);

  if(res.error){
    if(/not confirmed/i.test(res.error.message)){
      /*
        Do not open the old "Confirm your email first" screen.
        Stay on the normal login page and show a resend option.
      */
      pendingEmail = email;
      $("resendLogin").classList.remove("hide");
      say("Please verify your email first. We have sent a verification email.", "err");
      return;
    }
    say(friendly(res.error), "err");
    return;
  }

  $("lPass").value = "";
  $("resendLogin").classList.add("hide");
  goBackToOrigin();
};

/* Sign up */
$("stSignup").onsubmit = async function(e){
  e.preventDefault();

  var email = $("sEmail").value.trim();
  var p1 = $("sPass").value;

  if(p1.length < 8){
    say("Password must be at least 8 characters.", "err");
    return;
  }

  if(p1 !== $("sPass2").value){
    say("The two passwords do not match.", "err");
    return;
  }

  busy("sBtn", true);
  say("Creating your account...");

  /*
    IMPORTANT:
    Supabase sends the user back to login.html after email confirmation,
    and the original page is carried in returnTo.
  */
  var confirmationUrl =
    SITE + "login.html?returnTo=" +
    encodeURIComponent(returnTo);

  var res = await sb.auth.signUp({
    email: email,
    password: p1,
    options: {
      emailRedirectTo: confirmationUrl,
      data: {
        full_name: $("sName").value.trim(),
        phone: $("sPhone").value.trim() || undefined,
        role: $("sRole").value
      }
    }
  });

  busy("sBtn", false);

  if(res.error){
    say(friendly(res.error), "err");
    return;
  }

  if(res.data.user && res.data.user.identities && res.data.user.identities.length === 0){
    say("This email is already registered. Log in, or use Forgot password.", "err");
    return;
  }

  /*
    If Supabase returns a session immediately, the account does not need
    email confirmation and we can return to the original page now.
  */
  if(res.data.session){
    goBackToOrigin();
    return;
  }

  /*
    Instead of the old "Confirm your email first" page with Gmail buttons,
    keep the user on the signup/login page and show a simple success message.
  */
  show("stSignup");
  say(
    "Account created. Please check your email and click the verification link. After verification, you will be returned to the page where you started.",
    "ok"
  );
};

/* Resend verification email */
$("cResend").onclick = async function(){
  if(!pendingEmail){
    say("Enter your email address first.", "err");
    return;
  }

  say("Sending...");

  var res = await sb.auth.resend({
    type: "signup",
    email: pendingEmail,
    options: {
      emailRedirectTo: SITE + "login.html?returnTo=" + encodeURIComponent(returnTo)
    }
  });

  say(
    res.error ? friendly(res.error) : "The verification email was sent again.",
    res.error ? "err" : "ok"
  );
};

/* Forgot password */
$("stForgot").onsubmit = async function(e){
  e.preventDefault();

  var email = $("fEmail").value.trim();
  busy("fBtn", true);
  say("Sending...");

  var res = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: SITE + "login.html?returnTo=" + encodeURIComponent(returnTo)
  });

  busy("fBtn", false);

  if(res.error){
    say(friendly(res.error), "err");
    return;
  }

  $("cTitle").textContent = "Check your email";
  $("cText").textContent = "We sent a password reset link to " + email + ".";
  $("cSteps").innerHTML = "";
  [
    "Open your email and find the password reset email.",
    "Click the reset link.",
    "You will come back here to choose a new password."
  ].forEach(function(t){
    var li = document.createElement("li");
    li.textContent = t;
    $("cSteps").appendChild(li);
  });

  $("cGmail").classList.toggle("hide", !/@(gmail|googlemail)\.com$/i.test(email));
  $("cResend").classList.add("hide");
  $("cBack").textContent = "Back to log in";
  show("stCheck");
};

/* Back from check screen */
$("cBack").onclick = function(){
  $("cResend").classList.remove("hide");
  show("stLogin");
};

/* Set new password */
$("stReset").onsubmit = async function(e){
  e.preventDefault();

  var p1 = $("rPass").value;

  if(p1.length < 8){
    say("Password must be at least 8 characters.", "err");
    return;
  }

  if(p1 !== $("rPass2").value){
    say("The two passwords do not match.", "err");
    return;
  }

  busy("rBtn", true);
  say("Saving...");

  var u = await sb.auth.updateUser({password:p1});

  busy("rBtn", false);

  if(u.error){
    say(friendly(u.error), "err");
    return;
  }

  recovering = false;
  $("rPass").value = "";
  $("rPass2").value = "";

  say("Password saved. Returning to the page you started from...", "ok");
  setTimeout(goBackToOrigin, 300);
};

/* Logout */
$("logout").onclick = async function(){
  await sb.auth.signOut();
  show("stLogin");
  say("You are logged out. Log in again any time with your email and password.", "ok");
};

/* Manual home button */
$("goHome").onclick = function(){
  location.href = "index.html";
};

/* Supabase auth events */
sb.auth.onAuthStateChange(function(event, session){
  if(event === "PASSWORD_RECOVERY"){
    recovering = true;
    show("stReset");
    say("Choose a new password.", "ok");
    return;
  }

  /*
    Email confirmation normally creates a session.
    When that happens, immediately send the user back to their
    original page instead of showing "You are logged in".
  */
  if((event === "SIGNED_IN" || event === "INITIAL_SESSION") && session && !recovering){
    if(location.pathname.endsWith("/login.html") || location.pathname.endsWith("login.html")){
      setTimeout(goBackToOrigin, 100);
    }
  }
});

/*
  If the user opens the login page while already authenticated,
  return them to their original page.
*/
if(location.hash.indexOf("type=recovery") === -1){
  showSession();
}
</script>
</body>
</html>

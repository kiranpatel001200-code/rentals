<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviews | RentNest</title>
<meta name="description" content="Read reviews from renters and landlords who used RentNest, or share your own experience.">
<style>
:root{--navy:#0b2a5b;--blue:#1769e8;--ink:#1b2a41;--muted:#5b6b82;--bg:#f4f8ff;--line:#dbe6f6;--white:#fff;--star:#f5b301}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}
header.top{background:var(--white);box-shadow:0 1px 0 var(--line)}
header.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand b{display:block;font:800 1.45rem/1.1 system-ui,sans-serif;color:var(--blue);letter-spacing:-.5px}
.brand small{display:block;color:var(--muted);font-size:.78rem}
nav{display:flex;align-items:center;gap:26px}
nav a{text-decoration:none;color:var(--ink);font-weight:500;padding:6px 0;border-bottom:3px solid transparent}
nav a.on{color:var(--blue);border-bottom-color:var(--blue)}
nav a.pill{background:var(--blue);color:var(--white);padding:10px 22px;border-radius:99px;border:0;font-weight:600}
.banner{background:linear-gradient(135deg,#0b2a5b 0%,#1558c9 62%,#1769e8 100%);color:var(--white);padding:34px 0 66px}
.banner h1{font:800 clamp(1.8rem,4vw,2.6rem)/1.1 system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.8px}
.banner p{margin:0 0 6px;color:#d6e5ff;max-width:40em}
.banner .summary{color:var(--white);font-weight:700;font-size:1.1rem}
main.wrap{max-width:760px;margin-top:-34px;padding-bottom:40px}
h2{font:800 1.2rem/1.2 system-ui,sans-serif;color:var(--navy);margin:0 0 6px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--white)}
textarea{min-height:110px;resize:vertical}
button,.btn{display:inline-block;margin-top:14px;padding:11px 24px;font:600 1rem system-ui,sans-serif;color:var(--white);background:var(--blue);border:0;border-radius:10px;text-decoration:none;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
small{color:var(--muted)}
.sub{color:var(--muted);margin:0 0 12px}
.hide{display:none}
@media(max-width:700px){nav{gap:14px}nav a.hide-sm{display:none}}
.stars{color:var(--star);letter-spacing:2px}
.review{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 22px;margin:0 0 14px;box-shadow:0 6px 20px rgba(11,42,91,.07)}
.review p{margin:6px 0}
.review small{color:var(--muted)}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted)}
.box{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:26px 0 48px;box-shadow:0 6px 20px rgba(11,42,91,.07)}
#note{min-height:1.4em;margin-top:10px}
#note.err{color:#b3261e}
#note.ok{color:#0f6b4f}
small.hint{color:var(--muted);font-weight:400}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<a class="brand" href="index.html" aria-label="RentNest home">
<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 21 22 7l16 14v15a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z" fill="none" stroke="#1769e8" stroke-width="3.2" stroke-linejoin="round"/><path d="M15 31V19l7 7 7-7v12" fill="none" stroke="#1769e8" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>
<span><b>RentNest</b><small>Find Your Perfect Rental</small></span></a>
<nav>
<a href="index.html">Home</a><a href="listings.html">Rentals</a><a href="reviews.html" class="on">Reviews</a><a href="create-listing.html" class="hide-sm">List your property</a><a href="account.html" class="pill">My account</a>
</nav>
</div></header>
<section class="banner"><div class="wrap"><h1>Reviews</h1><p>Written by people who use RentNest. Every review is checked by our team before it appears.</p><p class="summary" id="summary"></p></div></section>

<main class="wrap">
<div id="list"></div>

<div class="box">
<h2>Write a review</h2>
<div id="needLogin" class="hide">
<p class="sub">Log in or sign up to share your experience. One review per account.</p>
<a class="btn" href="login.html?next=reviews.html">Log in or sign up</a>
</div>
<form id="f" class="hide" novalidate>
<label for="rating">Your rating</label>
<select id="rating"><option value="5">5 stars - Excellent</option><option value="4">4 stars - Good</option><option value="3">3 stars - Okay</option><option value="2">2 stars - Poor</option><option value="1">1 star - Bad</option></select>
<label for="name">Name to show <small class="hint">(first name and last initial, for example Maria G.)</small></label>
<input id="name" maxlength="40">
<label for="body">Your review <small class="hint">(20 to 600 characters)</small></label>
<textarea id="body" maxlength="600"></textarea>
<button type="submit" id="send">Submit review</button>
<p id="note" role="status" aria-live="polite"></p>
</form>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb = supabase.createClient("https://abppfpgazlngdhrejrog.supabase.co", "sb_publishable_aDiJt8SXRag8hD73rhiFuQ_ezmlGWo5");
var $ = function(id){ return document.getElementById(id); };
function say(t, k){ $("note").textContent = t || ""; $("note").className = k || ""; }
function stars(n){ return "\u2605".repeat(n) + "\u2606".repeat(5 - n); }

async function load(){
  var res = await sb.from("reviews").select("display_name,rating,body,created_at").eq("status", "approved").order("created_at", { ascending: false }).limit(50);
  var list = $("list"); list.textContent = "";
  var rows = res.data || [];
  if(res.error){ $("summary").textContent = "Could not load reviews. Please try again."; return; }
  if(!rows.length){
    $("summary").textContent = "";
    var e = document.createElement("p"); e.className = "empty";
    e.textContent = "No reviews yet. Be the first to share your experience.";
    list.appendChild(e); return;
  }
  var avg = rows.reduce(function(a, r){ return a + r.rating; }, 0) / rows.length;
  $("summary").textContent = avg.toFixed(1) + " out of 5 from " + rows.length + " review" + (rows.length > 1 ? "s" : "");
  rows.forEach(function(r){
    var d = document.createElement("div"); d.className = "review";
    var s = document.createElement("div"); s.className = "stars"; s.textContent = stars(r.rating);
    var p = document.createElement("p"); p.textContent = r.body;
    var m = document.createElement("small");
    m.textContent = r.display_name + " \u00B7 " + new Date(r.created_at).toLocaleDateString("en-US", { year: "numeric", month: "short" });
    d.appendChild(s); d.appendChild(p); d.appendChild(m); list.appendChild(d);
  });
}

async function init(){
  var s = await sb.auth.getSession();
  if(s.data.session){
    $("f").classList.remove("hide");
    var p = await sb.from("profiles").select("full_name").eq("id", s.data.session.user.id).maybeSingle();
    var n = (p.data && p.data.full_name || "").trim().split(/\s+/);
    if(n[0]){ $("name").value = n.length > 1 ? n[0] + " " + n[n.length - 1].charAt(0).toUpperCase() + "." : n[0]; }
  } else {
    $("needLogin").classList.remove("hide");
  }
  load();
}

$("f").onsubmit = async function(e){
  e.preventDefault();
  var name = $("name").value.trim(), body = $("body").value.trim();
  if(name.length < 2){ say("Enter the name to show.", "err"); return; }
  if(body.length < 20){ say("Please write at least 20 characters.", "err"); return; }
  $("send").disabled = true; say("Sending...");
  var res = await sb.from("reviews").insert({ display_name: name, rating: parseInt($("rating").value, 10), body: body });
  $("send").disabled = false;
  if(res.error){
    say(res.error.code === "23505" ? "You have already submitted a review. Thank you!" : "Could not send your review: " + res.error.message, "err");
    return;
  }
  $("body").value = "";
  say("Thank you! Your review will appear after our team checks it.", "ok");
};
init();
</script>
</body>
</html>
